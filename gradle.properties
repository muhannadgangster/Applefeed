# Project-wide Gradle settings.
# Specifies JVM arguments used for the Gradle build process.
# Limits maximum heap to 3 GB to comfortably operate within GitHub Actions 7 GB runner memory.
org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable daemon to avoid deadlocks, worker leaks, and persistent memory retention across steps
org.gradle.daemon=false

# Disable parallel execution to prevent DefaultWorkerLeaseService deadlock on GitHub Actions runners
org.gradle.parallel=false

# Restrict to a single worker process to prevent worker lease contention and OOM kills
org.gradle.workers.max=1

# Disable configuration cache to prevent stale worker lock serialization issues
org.gradle.configuration-cache=false

# Enable local build caching for performance without multi-worker contention
org.gradle.caching=true

# Kotlin compiler execution in-process prevents spawning separate background Kotlin compile daemons
kotlin.compiler.execution.strategy=in-process

# Official Kotlin code style
kotlin.code.style=official

# Resource namespacing
android.nonTransitiveRClass=true

# Allow google-services plugin to proceed cleanly if google-services.json is absent in CI
googleServices.missing.passthrough=true
