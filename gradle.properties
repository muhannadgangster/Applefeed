# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# -Xmx3g fits safely within the 7GB memory limit of GitHub Actions Ubuntu runners.
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -Dfile.encoding=UTF-8

# Disable Gradle daemon to prevent worker lease issues and memory leaks in CI runners
org.gradle.daemon=false

# Incubation / Parallel settings
org.gradle.parallel=true

# Kotlin code style for this project
kotlin.code.style=official

# Resource namespacing
android.nonTransitiveRClass=true

# Gradle build cache
org.gradle.caching=true

# Disable configuration cache to prevent stale worker lease or serialization crashes in CI
org.gradle.configuration-cache=false

# Restrict worker processes to 2 to match GitHub Actions 2-core runner vCPUs and avoid OOM
org.gradle.workers.max=2

# In-process Kotlin compilation avoids spawning separate Kotlin daemon processes
kotlin.compiler.execution.strategy=in-process

# Allow the google-services plugin to work even if google-services.json is not present
googleServices.missing.passthrough=true
